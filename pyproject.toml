[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "softplan-common"
version = "0.1.0"
description = "Shared Python infrastructure for Softplan services"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "common"}

[tool.setuptools.packages.find]
where = ["common"]
