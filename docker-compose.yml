services:
  web:
    build:
      context: ./frontend
    container_name: softplan-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: softplan-api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_LOG_FORMAT: ${APP_LOG_FORMAT:-auto}
      APP_LOG_ACCESS_ENABLED: ${APP_LOG_ACCESS_ENABLED:-true}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-softplan}:${POSTGRES_PASSWORD:-softplan}@postgres:5432/${POSTGRES_DB:-softplan}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-softplan}
      FILE_CONVERT_SERVICE_BASE_URL: ${FILE_CONVERT_SERVICE_BASE_URL:-}
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      DOCUMENT_PARSING_TASK_WORKER_ENABLED: ${DOCUMENT_PARSING_TASK_WORKER_ENABLED:-true}
      DOCUMENT_PARSING_TASK_WORKER_POLL_INTERVAL_SECONDS: ${DOCUMENT_PARSING_TASK_WORKER_POLL_INTERVAL_SECONDS:-1.0}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg15-trixie
    container_name: softplan-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-softplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-softplan}
      POSTGRES_DB: ${POSTGRES_DB:-softplan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init/01-pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-softplan} -d ${POSTGRES_DB:-softplan}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: softplan-minio
    command: server /data --console-address ":9001"
    ports:
      - "10000:9000"
      - "10001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
